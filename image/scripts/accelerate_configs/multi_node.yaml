# Plain DDP across machines. Set main_process_ip to the rank-0 host and launch once per node
# with a matching --machine_rank, or just pass --main_process_ip / --num_machines on the
# accelerate command line and ignore this file.
compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
downcast_bf16: 'yes'
gpu_ids: all
machine_rank: 0
main_process_ip: 127.0.0.1
main_process_port: 19500
main_training_function: main
mixed_precision: bf16
num_machines: 2
num_processes: 16
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
